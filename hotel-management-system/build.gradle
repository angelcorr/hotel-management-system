plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'edu.hoteluq'
version = '1.0'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

javafx {
    version = '21.0.2'
    modules = ['javafx.controls', 'javafx.fxml']
}

application {
    mainClass = 'edu.hoteluq.Main'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

test {
    useJUnitPlatform()
}

// Optional integration suite: real JavaFX toolkit and display, separate from display-independent regression.
sourceSets {
    fxTest {
        java.srcDir 'src/fxTest/java'
        compileClasspath += sourceSets.main.output + sourceSets.test.output
        runtimeClasspath += sourceSets.main.output + sourceSets.test.output
    }
}
configurations {
    fxTestImplementation.extendsFrom testImplementation
    fxTestRuntimeOnly.extendsFrom testRuntimeOnly
}
tasks.register('fxTest', Test) {
    description = 'Runs real JavaFX integration tests; requires an accessible graphical display.'
    group = 'verification'
    testClassesDirs = sourceSets.fxTest.output.classesDirs
    classpath = sourceSets.fxTest.runtimeClasspath
    useJUnitPlatform()
    maxParallelForks = 1
    forkEvery = 1 // Each JavaFX test class owns its toolkit lifecycle.
    systemProperty 'prism.order', 'sw'
}
